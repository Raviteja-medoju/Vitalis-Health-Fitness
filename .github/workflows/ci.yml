name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tokens · A11y · Lint · Types · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens are in sync with Figma source (tokens.json)
        run: npm run tokens:check
      - name: WCAG 2.1 AA contrast audit
        run: npm run a11y:contrast
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Coach server unit tests
        working-directory: server
        run: |
          npm ci
          npm test

  web-build:
    name: Web export
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  # Native builds run on EAS (needs EXPO_TOKEN secret). Enabled on main only.
  eas-preview:
    name: EAS preview build (iOS + Android)
    if: github.ref == 'refs/heads/main' && vars.EAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform all --profile preview --non-interactive --no-wait
